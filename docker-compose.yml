services:
  postgres:
    image: postgres:18-alpine
    container_name: archng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archng
    ports:
      - "5432:5432"
    volumes:
      - archng-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archng"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archng-postgres:
